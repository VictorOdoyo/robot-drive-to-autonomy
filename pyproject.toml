[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-drive-to-autonomy"
version = "0.1.0"
description = "Electrical drive, estimation and autonomy experiments for a differential-drive robot"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["numpy>=2,<3", "scipy>=1.11,<2", "matplotlib>=3.8,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.17,<0.18", "build>=1"]

[project.scripts]
robotlab = "robotlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "RUF"]
