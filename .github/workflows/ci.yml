name: Engineering checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      - run: uv sync --locked --extra dev --python 3.13
      - run: uv run ruff check src tests examples
      - run: uv run ruff format --check src tests examples

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      - run: uv sync --locked --extra dev --python ${{ matrix.python }}
      - run: uv run python -m pytest -q

  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      - run: uv build
      - run: uv venv .wheel-smoke --python 3.13
      - run: uv pip install --python .wheel-smoke/bin/python dist/*.whl
      - name: Run the installed wheel outside the checkout
        working-directory: /tmp
        run: |
          "$GITHUB_WORKSPACE/.wheel-smoke/bin/python" -m robotlab list
          "$GITHUB_WORKSPACE/.wheel-smoke/bin/python" -m robotlab run --case commissioning --duration 0.1 --output /tmp/robotlab-wheel-report
